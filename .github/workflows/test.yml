name: test
on: [push, pull_request]
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 依存パッケージなし(ビルド工程を持たない設計・§3)。Node標準のテストランナーだけで回す
      - run: node --test tests/*.test.js
